name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e packages/contracts -e "apps/ai-engine[dev]" -e "apps/platform[dev]"
      - name: Test contracts
        run: cd packages/contracts && ../../.venv/bin/pytest tests -q
      - name: Test AI engine
        run: cd apps/ai-engine && ../../.venv/bin/pytest -q
      - name: Test platform
        run: cd apps/platform && ../../.venv/bin/pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
