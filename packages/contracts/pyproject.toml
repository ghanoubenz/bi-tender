[project]
name = "tender-contracts"
version = "0.1.0"
description = "Shared contracts between the Tender Platform and the Tender AI Engine. The ONLY code shared across services."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tender_contracts*"]
