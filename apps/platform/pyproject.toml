[project]
name = "tender-platform"
version = "0.1.0"
description = "Tender Intelligence Platform — customer-facing application API (Django + DRF)"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0,<6",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.3",
    "django-simple-history>=3.5",
    "httpx>=0.27",
    "tender-contracts",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
storage = ["django-storages[s3]>=1.14"]
dev = ["pytest>=8", "pytest-django>=4.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "core*", "tenders*"]
