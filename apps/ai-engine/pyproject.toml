[project]
name = "tender-ai-engine"
version = "0.1.0"
description = "Tender AI Engine — standalone, platform-independent tender intelligence service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "tender-contracts",
]

[project.optional-dependencies]
# Live LLM providers via the AI Gateway (OpenAI / Anthropic / Gemini through LiteLLM)
live = ["litellm>=1.40"]
# Layout- and table-aware parsing + OCR (MIT licensed; heavy install)
docling = ["docling>=2.0"]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.2"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*"]
